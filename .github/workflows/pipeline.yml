name: pipeline

on:
  push:
  pull_request:

jobs:
  syntax:
    name: syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: compile every tool
        run: |
          python3 -m py_compile \
            tools/le.py \
            tools/inventory.py \
            tools/extract_cd_image.py \
            tools/dosboxx_control.py \
            tools/entry_probe.py \
            tools/gfx_container.py tools/export_assets.py tools/sound_bank.py \
            tools/member_probe.py tools/rebuild/diff_module.py \
            tools/pipeline_check.py

  pipeline:
    name: full pipeline
    # The full check needs the installed game and DOSBox-X, so it runs only on a
    # self-hosted runner that holds both.  Set the repository variable
    # SCREAMER_SELF_HOSTED to true to enable the job.
    if: vars.SCREAMER_SELF_HOSTED == 'true'
    runs-on: [self-hosted, macOS, screamer-artifacts]
    steps:
      - uses: actions/checkout@v4
      - name: run the pipeline check
        env:
          SCREAMER_GAME_DIR: ${{ vars.SCREAMER_GAME_DIR }}
        run: |
          GAME_DIR="${SCREAMER_GAME_DIR:-$HOME/Documents/Screamer.app/Contents/Resources/game}"
          python3 tools/pipeline_check.py --game-dir "$GAME_DIR"
